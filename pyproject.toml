[project]
name = "model-price-radar-mcp"
version = "0.1.0"
description = "MCP server: LLM prices on OpenRouter now and since 2023 (price history, drops, cheapest model for a job). No API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ali Altunar" }]
keywords = ["mcp", "model-context-protocol", "llm", "pricing", "openrouter", "ai-models", "cost", "claude"]
dependencies = [
  "mcp>=2.2,<3",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/alialtunar/model-price-radar-mcp"
Repository = "https://github.com/alialtunar/model-price-radar-mcp"
Issues = "https://github.com/alialtunar/model-price-radar-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
model-price-radar-mcp = "model_price_radar.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_price_radar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
